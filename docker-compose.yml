# Local infrastructure. Reads variables from ./.env (copy .env.example).
#   docker compose up -d            # Postgres only (run the API with `pnpm nx serve api`)
#   docker compose --profile api up -d   # also run the API in a container
name: greetday

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-greetday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greetday_local}
      POSTGRES_DB: ${POSTGRES_DB:-greetday_dev}
      # Used by docker/postgres/init scripts (first start only).
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-greetday_test}
      POSTGRES_READONLY_USER: ${POSTGRES_READONLY_USER:-greetday_readonly}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-greetday_readonly_local}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ['api']
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-greetday}:${POSTGRES_PASSWORD:-greetday_local}@postgres:5432/${POSTGRES_DB:-greetday_dev}
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
